server:
  port: 8081

spring:
  main:
    web-application-type: servlet
  application:
    name: expensetracker
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/expenses?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: springuser
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect